<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Limiter Lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <h1>Rate Limiter Lab</h1>
    <p class="sub">Sliding Window Log vs Token Bucket &middot; live Redis state &middot; concurrent virtual clients</p>
  </div>
  <div class="conn"><span id="dot" class="dot"></span><span id="connText">connecting…</span></div>
</header>

<section class="toolbar">
  <label>Send to
    <select id="algo">
      <option value="both">Both algorithms</option>
      <option value="swl">Sliding Window Log</option>
      <option value="tb">Token Bucket</option>
    </select>
  </label>
  <label>Burst size
    <input id="burstSize" type="number" min="1" max="100" value="20">
  </label>
  <button id="fireAll" class="primary">&#9889; Fire ALL clients concurrently</button>
  <button id="autoBtn">&#9654; Start auto traffic</button>
  <button id="resetBtn" class="danger">Reset Redis state</button>
  <span id="status" class="status"></span>
</section>

<section class="legend" id="legend"></section>

<main>
  <section id="grid" class="grid"></section>
  <aside>
    <div class="panel">
      <h2>Redis inspector <span id="inspTarget" class="muted"></span></h2>
      <pre id="inspector">click a client card…</pre>
    </div>
    <div class="panel">
      <h2>Request log</h2>
      <ul id="log" class="log"></ul>
    </div>
  </aside>
</main>

<section class="panel checklist">
  <h2>Security checklist applied to this project</h2>
  <ul id="checks"></ul>
</section>

<script src="/app.js"></script>
</body>
</html>
